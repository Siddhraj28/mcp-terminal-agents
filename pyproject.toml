[project]
name = "mcp_terminal_agents"
version = "0.1.0"
description = "An MCP terminal adds capabilities to an agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.5",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mcp_terminal_agents = "mcp_terminal.main:main"